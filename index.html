<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光路图孔位固定原型</title>
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <strong>光路图绘制</strong>
          <span>孔位固定原型</span>
        </div>

        <section>
          <h2>光学桌</h2>
          <label>
            桌面尺寸
            <select id="tablePreset">
              <option value="300x300">300 x 300 mm 面包板</option>
              <option value="450x300">450 x 300 mm 面包板</option>
              <option value="600x450">600 x 450 mm 光学桌</option>
            </select>
          </label>
          <div class="meta-grid">
            <span>孔距</span><strong>25 mm</strong>
            <span>边距</span><strong>25 mm</strong>
          </div>
        </section>

        <section>
          <h2>元件库</h2>
          <button id="openComponentPicker" class="primary-button" type="button">添加元件</button>
        </section>

        <section>
          <h2>选中元件</h2>
          <div id="emptyState" class="empty">点击元件后编辑固定方式</div>
          <div id="inspector" class="inspector" hidden>
            <div class="component-library-name">
              元件库名称：<strong id="componentLibraryName"></strong>
            </div>
            <label>
              元件标签
              <input id="componentLabel" type="text" />
            </label>
            <label>
              元件角度
              <div class="input-row">
                <input id="componentRotation" type="range" min="-180" max="180" value="0" />
                <input id="componentRotationNumber" type="number" min="-180" max="180" step="1" value="0" />
              </div>
              <output id="componentRotationValue">0 deg</output>
            </label>
            <label>
              压板角度
              <input id="clampRotation" type="range" min="-180" max="180" value="0" />
              <output id="clampRotationValue">0 deg</output>
            </label>
            <label>
              最大自动转角
              <input id="clampFlex" type="range" min="0" max="180" value="180" />
              <output id="clampFlexValue">180 deg</output>
            </label>
            <label id="wavelengthControls" hidden>
              光源波长
              <input id="wavelengthInput" type="number" min="200" max="2000" step="1" value="650" />
              <output id="wavelengthValue">650 nm</output>
            </label>
            <div id="lockStatus" class="status"></div>
          </div>
        </section>

        <section>
          <h2>固定规则</h2>
          <p>
            拖动元件后压板会自动选择最小转角的可用孔位。压板之间不能重合；螺丝被柱子挡住时仍可固定，但会显示警告。
          </p>
        </section>

        <section>
          <h2>反射规则</h2>
          <p>
            光源沿元件角度发射光线。光线碰到反射镜线段后，按照入射角等于反射角自动生成下一段。
          </p>
        </section>
      </aside>

      <section class="workspace">
        <div class="toolbar">
          <button id="resetView" type="button">重置视图</button>
          <button id="clearAll" type="button">清空元件</button>
          <button id="exportSvg" type="button">导出 SVG</button>
          <button id="exportPng" type="button">导出 PNG</button>
          <span id="exportStatus" role="status"></span>
          <span id="readout">1 px = 1 mm</span>
        </div>
        <div id="placementBar" class="placement-bar" hidden>
          <span class="placement-indicator"></span>
          <div>
            <strong>悬置：<span id="pendingComponentName"></span></strong>
            <small>拖动元件预览孔位与压板位置，确认后再置入光路。</small>
          </div>
          <label class="placement-label">
            标签
            <input id="pendingComponentLabel" type="text" />
          </label>
          <button id="cancelPlacement" type="button">取消</button>
          <button id="confirmPlacement" class="primary-button" type="button">置入</button>
        </div>
        <div class="canvas-shell">
          <svg id="canvas" aria-label="光学桌画布"></svg>
        </div>
      </section>
    </main>

    <div id="componentPicker" class="modal-backdrop" hidden>
      <div class="picker-dialog" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <header class="picker-header">
          <div>
            <h1 id="pickerTitle">选择光学元件</h1>
            <p>从元件库中选择一个器件加入画布。</p>
          </div>
          <button id="closeComponentPicker" class="icon-button" type="button" aria-label="关闭">×</button>
        </header>
        <div class="picker-toolbar">
          <label>
            搜索元件
            <input id="componentSearch" type="search" placeholder="输入名称" />
          </label>
          <label>
            元件类型
            <select id="componentTypeFilter">
              <option value="all">全部类型</option>
              <option value="source">光源</option>
              <option value="reflector">反射元件</option>
              <option value="transmissive">透射元件</option>
              <option value="beamsplitter">分束元件</option>
            </select>
          </label>
        </div>
        <div id="componentCatalog" class="component-catalog"></div>
        <footer class="picker-footer">
          <span id="pickerSelectionSummary">尚未选择元件</span>
          <button id="cancelComponentPicker" type="button">取消</button>
          <button id="confirmComponentPicker" class="primary-button" type="button" disabled>确定</button>
        </footer>
      </div>
    </div>

    <div id="exportPreview" class="modal-backdrop" hidden>
      <div class="export-dialog" role="dialog" aria-modal="true" aria-labelledby="exportPreviewTitle">
        <header class="picker-header">
          <div>
            <h1 id="exportPreviewTitle">导出预览</h1>
            <p>下载后由浏览器保存到系统默认下载文件夹。</p>
          </div>
          <button id="closeExportPreview" class="icon-button" type="button" aria-label="关闭导出预览">×</button>
        </header>
        <div class="export-preview-stage">
          <img id="exportPreviewImage" alt="光路图导出预览" />
        </div>
        <footer class="export-footer">
          <div>
            <strong id="exportPreviewFilename"></strong>
            <span id="exportPreviewMeta"></span>
          </div>
          <button id="cancelExportPreview" type="button">取消</button>
          <button id="downloadExportPreview" class="primary-button" type="button">下载到本地</button>
        </footer>
      </div>
    </div>

    <script src="./component-library.js?v=8"></script>
    <script src="./app.js?v=25"></script>
  </body>
</html>
